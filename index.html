<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucid Framework - Dream Graph Builder</title>
    <style>
        :root {
            --color-bg-1: rgba(59, 130, 246, 0.08);
            --color-bg-2: rgba(245, 158, 11, 0.08);
            --color-bg-3: rgba(34, 197, 94, 0.08);
            --color-bg-4: rgba(239, 68, 68, 0.08);
            --color-bg-5: rgba(147, 51, 234, 0.08);
            --color-brown-600-rgb: 94, 82, 64;
            --color-teal-500-rgb: 33, 128, 141;
            --color-slate-900-rgb: 19, 52, 59;
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-teal-700: rgba(26, 104, 115, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-gray-200: rgba(245, 245, 245, 1);
            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-primary-active: var(--color-teal-700);
            --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
            --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
            --color-border: rgba(var(--color-brown-600-rgb), 0.2);
            --color-btn-primary-text: var(--color-cream-50);
            --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
            --radius-base: 8px;
            --radius-lg: 12px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-24: 24px;
            --font-size-base: 14px;
            --font-size-lg: 16px;
            --font-size-2xl: 20px;
            --font-size-3xl: 24px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-charcoal-700: rgba(31, 33, 33, 1);
                --color-charcoal-800: rgba(38, 40, 40, 1);
                --color-teal-300: rgba(50, 184, 198, 1);
                --color-teal-400: rgba(45, 166, 178, 1);
                --color-gray-300: rgba(167, 169, 169, 1);
                --color-gray-400-rgb: 119, 124, 124;
                --color-teal-300-rgb: 50, 184, 198;
                --color-bg-1: rgba(29, 78, 216, 0.15);
                --color-bg-2: rgba(180, 83, 9, 0.15);
                --color-bg-3: rgba(21, 128, 61, 0.15);
                --color-bg-4: rgba(185, 28, 28, 0.15);
                --color-bg-5: rgba(107, 33, 168, 0.15);
                --color-background: var(--color-charcoal-700);
                --color-surface: var(--color-charcoal-800);
                --color-text: var(--color-gray-200);
                --color-text-secondary: rgba(var(--color-gray-300), 0.7);
                --color-primary: var(--color-teal-300);
                --color-primary-hover: var(--color-teal-400);
                --color-secondary: rgba(var(--color-gray-400-rgb), 0.15);
                --color-secondary-hover: rgba(var(--color-gray-400-rgb), 0.25);
                --color-border: rgba(var(--color-gray-400-rgb), 0.3);
                --color-card-border: rgba(var(--color-gray-400-rgb), 0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-24);
        }

        header {
            text-align: center;
            margin-bottom: var(--space-24);
            padding: var(--space-24);
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-card-border);
        }

        h1 {
            font-size: var(--font-size-3xl);
            margin-bottom: var(--space-8);
            background: linear-gradient(135deg, var(--color-primary), var(--color-teal-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
        }

        .layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: var(--space-24);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: var(--space-16);
        }

        .card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-card-border);
            padding: var(--space-16);
        }

        .card h2 {
            font-size: var(--font-size-lg);
            margin-bottom: var(--space-16);
            color: var(--color-text);
        }

        .form-group {
            margin-bottom: var(--space-16);
        }

        label {
            display: block;
            margin-bottom: var(--space-8);
            font-weight: 500;
            font-size: var(--font-size-base);
            color: var(--color-text);
        }

        input, select {
            width: 100%;
            padding: var(--space-8) var(--space-12);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            background: var(--color-background);
            color: var(--color-text);
            font-size: var(--font-size-base);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: 2px solid var(--color-primary);
            border-color: var(--color-primary);
        }

        .btn {
            width: 100%;
            padding: var(--space-12) var(--space-16);
            background: var(--color-primary);
            color: var(--color-btn-primary-text);
            border: none;
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--color-primary-hover);
        }

        .btn:active {
            background: var(--color-primary-active);
        }

        .btn-secondary {
            background: var(--color-secondary);
            color: var(--color-text);
        }

        .btn-secondary:hover {
            background: var(--color-secondary-hover);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-8);
        }

        #canvas-container {
            position: relative;
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-card-border);
            overflow: hidden;
            height: 600px;
        }

        #graphCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #graphCanvas:active {
            cursor: grabbing;
        }

        .scene-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .scene-item {
            padding: var(--space-12);
            margin-bottom: var(--space-8);
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            cursor: pointer;
            transition: all 0.2s;
        }

        .scene-item:hover {
            background: var(--color-secondary);
            border-color: var(--color-primary);
        }

        .scene-item.selected {
            background: var(--color-primary);
            color: var(--color-btn-primary-text);
            border-color: var(--color-primary);
        }

        .scene-id {
            font-weight: 600;
            font-size: var(--font-size-base);
        }

        .scene-name {
            font-size: var(--font-size-base);
            margin-top: 4px;
            opacity: 0.9;
        }

        #sequenceOutput {
            margin-top: var(--space-16);
            padding: var(--space-16);
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: var(--font-size-base);
            white-space: pre-wrap;
        }

        .analysis-item {
            padding: var(--space-12);
            margin-bottom: var(--space-8);
            background: var(--color-background);
            border-left: 3px solid var(--color-primary);
            border-radius: var(--radius-base);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-24);
            color: var(--color-text-secondary);
        }

        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌙 LUCID FRAMEWORK</h1>
            <p class="subtitle">Interactive Dream Graph Builder & Sequence Generator</p>
        </header>

        <div class="layout">
            <div class="sidebar">
                <!-- Add Scene Card -->
                <div class="card">
                    <h2>➕ Add Dream Scene</h2>
                    <div class="form-group">
                        <label for="sceneDesc">Scene Description</label>
                        <input type="text" id="sceneDesc" placeholder="e.g., Walking through a misty forest">
                    </div>
                    <button class="btn" onclick="addScene()">Add Scene</button>
                </div>

                <!-- Add Transition Card -->
                <div class="card">
                    <h2>🔗 Add Transition</h2>
                    <div class="form-group">
                        <label for="fromScene">From Scene</label>
                        <select id="fromScene">
                            <option value="">Select source scene</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="toScene">To Scene</label>
                        <select id="toScene">
                            <option value="">Select destination scene</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="probability">Probability (0.0 - 1.0)</label>
                        <input type="number" id="probability" min="0" max="1" step="0.1" value="0.5">
                    </div>
                    <button class="btn" onclick="addTransition()">Add Transition</button>
                </div>

                <!-- Scene List -->
                <div class="card">
                    <h2>📋 Scenes</h2>
                    <div class="scene-list" id="sceneList">
                        <div class="empty-state">No scenes yet. Add your first dream scene!</div>
                    </div>
                </div>

                <!-- Actions Card -->
                <div class="card">
                    <h2>⚡ Actions</h2>
                    <button class="btn btn-secondary" onclick="analyzeTransitions()">Analyze Transitions</button>
                    <button class="btn" onclick="interpretDream()" style="margin-top: 12px;">🔮 Interpret Dream</button>
                </div>
            </div>

            <!-- Main Canvas Area -->
            <div>
                <div id="canvas-container">
                    <canvas id="graphCanvas"></canvas>
                </div>

                <!-- Output Display -->
                <div class="card" style="margin-top: 24px;">
                    <h2>📊 Output</h2>
                    <div id="sequenceOutput" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dream Graph Data Structure
        let scenes = [];
        let sceneIdCounter = 0;
        let selectedFromScene = null;

        // Initialize canvas on page load
        window.addEventListener('load', () => {
            resizeCanvas();
        });

        // Canvas Setup
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let offset = { x: 0, y: 0 };

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawGraph();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Add Scene Function
        function addScene() {
            const desc = document.getElementById('sceneDesc').value.trim();
            if (!desc) {
                alert('Please enter a scene description');
                return;
            }

            const scene = {
                id: ++sceneIdCounter,
                name: desc,
                edges: [],
                x: Math.random() * (canvas.width - 200) + 100,
                y: Math.random() * (canvas.height - 200) + 100
            };

            scenes.push(scene);
            document.getElementById('sceneDesc').value = '';
            
            // Apply force-directed layout to prevent overlaps
            for (let i = 0; i < 50; i++) {
                applyForceLayout();
            }
            
            updateSceneSelects();
            updateSceneList();
            drawGraph();
        }

        // Add Transition Function
        function addTransition() {
            const fromId = parseInt(document.getElementById('fromScene').value);
            const toId = parseInt(document.getElementById('toScene').value);
            const prob = parseFloat(document.getElementById('probability').value);

            if (!fromId || !toId) {
                alert('Please select both source and destination scenes');
                return;
            }

            if (fromId === toId) {
                alert('Source and destination must be different');
                return;
            }

            if (prob < 0 || prob > 1) {
                alert('Probability must be between 0.0 and 1.0');
                return;
            }

            const fromScene = scenes.find(s => s.id === fromId);
            const toScene = scenes.find(s => s.id === toId);

            fromScene.edges.push({
                to: toScene,
                probability: prob
            });

            document.getElementById('probability').value = 0.5;
            drawGraph();
        }

        // Update Scene Dropdowns
        function updateSceneSelects() {
            const fromSelect = document.getElementById('fromScene');
            const toSelect = document.getElementById('toScene');
            
            const options = scenes.map(s => 
                `<option value="${s.id}">Scene ${s.id}: ${s.name}</option>`
            ).join('');

            fromSelect.innerHTML = '<option value="">Select source scene</option>' + options;
            toSelect.innerHTML = '<option value="">Select destination scene</option>' + options;
        }

        // Update Scene List
        function updateSceneList() {
            const list = document.getElementById('sceneList');
            
            if (scenes.length === 0) {
                list.innerHTML = '<div class="empty-state">No scenes yet. Add your first dream scene!</div>';
                return;
            }

            list.innerHTML = scenes.map(scene => `
                <div class="scene-item" onclick="selectScene(${scene.id})">
                    <div class="scene-id">Scene ${scene.id}</div>
                    <div class="scene-name">${scene.name}</div>
                </div>
            `).join('');
        }

        // Select Scene
        function selectScene(id) {
            const items = document.querySelectorAll('.scene-item');
            items.forEach(item => item.classList.remove('selected'));
            event.target.closest('.scene-item').classList.add('selected');
        }

        // Check if a point is inside a circle (scene node)
        function isPointInCircle(px, py, cx, cy, radius) {
            const dx = px - cx;
            const dy = py - cy;
            return (dx * dx + dy * dy) <= (radius * radius);
        }

        // Find scene at mouse position
        function findSceneAtPosition(x, y) {
            for (let i = scenes.length - 1; i >= 0; i--) {
                const scene = scenes[i];
                const sx = scene.x + offset.x;
                const sy = scene.y + offset.y;
                if (isPointInCircle(x, y, sx, sy, 35)) {
                    return scene;
                }
            }
            return null;
        }

        // Apply force-directed layout to prevent overlaps
        function applyForceLayout() {
            const repulsionStrength = 5000;
            const minDistance = 100;
            
            for (let i = 0; i < scenes.length; i++) {
                let fx = 0, fy = 0;
                
                for (let j = 0; j < scenes.length; j++) {
                    if (i === j) continue;
                    
                    const dx = scenes[i].x - scenes[j].x;
                    const dy = scenes[i].y - scenes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < minDistance && distance > 0) {
                        const force = repulsionStrength / (distance * distance);
                        fx += (dx / distance) * force;
                        fy += (dy / distance) * force;
                    }
                }
                
                scenes[i].x += fx * 0.01;
                scenes[i].y += fy * 0.01;
                
                // Keep within bounds
                scenes[i].x = Math.max(80, Math.min(canvas.width - 80, scenes[i].x));
                scenes[i].y = Math.max(80, Math.min(canvas.height - 80, scenes[i].y));
            }
        }

        // Draw Graph on Canvas
        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (scenes.length === 0) {
                ctx.fillStyle = getComputedStyle(document.documentElement)
                    .getPropertyValue('--color-text-secondary');
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Add scenes to visualize your dream graph', canvas.width / 2, canvas.height / 2);
                return;
            }

            // Draw edges with arrows
            scenes.forEach(scene => {
                scene.edges.forEach(edge => {
                    const from = { x: scene.x + offset.x, y: scene.y + offset.y };
                    const to = { x: edge.to.x + offset.x, y: edge.to.y + offset.y };

                    // Calculate angle for arrow
                    const angle = Math.atan2(to.y - from.y, to.x - from.x);
                    const distance = Math.sqrt(Math.pow(to.x - from.x, 2) + Math.pow(to.y - from.y, 2));
                    const arrowEnd = {
                        x: to.x - 40 * Math.cos(angle),
                        y: to.y - 40 * Math.sin(angle)
                    };

                    // Draw line
                    ctx.strokeStyle = `rgba(33, 128, 141, ${edge.probability})`;
                    ctx.lineWidth = 2 + edge.probability * 2;
                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(arrowEnd.x, arrowEnd.y);
                    ctx.stroke();

                    // Draw arrow head
                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.beginPath();
                    ctx.moveTo(arrowEnd.x, arrowEnd.y);
                    ctx.lineTo(
                        arrowEnd.x - 10 * Math.cos(angle - Math.PI / 6),
                        arrowEnd.y - 10 * Math.sin(angle - Math.PI / 6)
                    );
                    ctx.lineTo(
                        arrowEnd.x - 10 * Math.cos(angle + Math.PI / 6),
                        arrowEnd.y - 10 * Math.sin(angle + Math.PI / 6)
                    );
                    ctx.closePath();
                    ctx.fill();

                    // Draw probability label
                    const midX = (from.x + arrowEnd.x) / 2;
                    const midY = (from.y + arrowEnd.y) / 2;
                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue('--color-surface');
                    ctx.fillRect(midX - 20, midY - 10, 40, 20);
                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue('--color-text');
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(edge.probability.toFixed(2), midX, midY + 4);
                });
            });

            // Draw nodes
            const colors = [
                'var(--color-bg-1)', 'var(--color-bg-2)', 'var(--color-bg-3)', 
                'var(--color-bg-4)', 'var(--color-bg-5)'
            ];

            scenes.forEach((scene, index) => {
                const x = scene.x + offset.x;
                const y = scene.y + offset.y;
                const colorVar = colors[index % colors.length];
                const colorValue = getComputedStyle(document.documentElement)
                    .getPropertyValue(colorVar.replace('var(', '').replace(')', ''));

                // Draw node circle
                ctx.fillStyle = colorValue;
                ctx.strokeStyle = getComputedStyle(document.documentElement)
                    .getPropertyValue('--color-primary');
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Draw node label
                ctx.fillStyle = getComputedStyle(document.documentElement)
                    .getPropertyValue('--color-text');
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`S${scene.id}`, x, y + 5);

                // Draw scene name below
                ctx.font = '12px sans-serif';
                const maxWidth = 100;
                const text = scene.name.length > 15 ? scene.name.substring(0, 15) + '...' : scene.name;
                ctx.fillText(text, x, y + 55);
            });
        }

        // Canvas Drag Functionality - supports both canvas panning and node dragging
        let draggedScene = null;
        let dragOffset = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // Check if clicking on a scene node
            draggedScene = findSceneAtPosition(mouseX, mouseY);
            
            if (draggedScene) {
                // Dragging a scene node
                dragOffset.x = mouseX - (draggedScene.x + offset.x);
                dragOffset.y = mouseY - (draggedScene.y + offset.y);
                canvas.style.cursor = 'grabbing';
            } else {
                // Dragging the canvas
                isDragging = true;
                dragStart = { x: e.clientX - offset.x, y: e.clientY - offset.y };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (draggedScene) {
                draggedScene.x = mouseX - offset.x - dragOffset.x;
                draggedScene.y = mouseY - offset.y - dragOffset.y;
                
                draggedScene.x = Math.max(80, Math.min(canvas.width - 80, draggedScene.x));
                draggedScene.y = Math.max(80, Math.min(canvas.height - 80, draggedScene.y));
                
                drawGraph();
            } else if (isDragging) {
                offset.x = e.clientX - dragStart.x;
                offset.y = e.clientY - dragStart.y;
                drawGraph();
            } else {
                const hoverScene = findSceneAtPosition(mouseX, mouseY);
                canvas.style.cursor = hoverScene ? 'grab' : 'grab';
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            draggedScene = null;
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            draggedScene = null;
            canvas.style.cursor = 'grab';
        });

        function analyzeTransitions() {
            if (scenes.length === 0) {
                alert('Add scenes first to analyze');
                return;
            }

            let analysis = [`🔍 Transition Analysis\n${'='.repeat(40)}\n`];
            
            scenes.forEach(scene => {
                if (scene.edges.length === 0) {
                    analysis.push(`• "${scene.name}": No outgoing transitions`);
                } else {
                    const maxEdge = scene.edges.reduce((max, e) => 
                        e.probability > max.probability ? e : max
                    );
                    analysis.push(
                        `• "${scene.name}"\n  → Most likely: "${maxEdge.to.name}" (${(maxEdge.probability * 100).toFixed(0)}%)`
                    );
                }
            });

            const output = document.getElementById('sequenceOutput');
            output.style.display = 'block';
            output.textContent = analysis.join('\n\n');
        }

        const dreamSymbols = {
            'forest': 'Exploration of the unconscious, feeling lost or searching for direction',
            'door': 'New opportunities, transitions, or choices in life',
            'water': 'Emotions, the subconscious mind, purification or cleansing',
            'flying': 'Freedom, ambition, escaping limitations or rising above problems',
            'falling': 'Loss of control, anxiety, fear of failure',
            'animal': 'Instincts, natural behaviors, untamed aspects of personality',
            'house': 'The self, different rooms represent different aspects of personality',
            'mirror': 'Self-reflection, self-image, how you see yourself',
            'stairs': 'Progress, ascension or descent in life journey',
            'ocean': 'Vast emotions, the collective unconscious, life mysteries',
            'mountain': 'Challenges, goals, spiritual elevation or achievement',
            'darkness': 'Unknown aspects of self, fear, mystery or the unconscious',
            'light': 'Enlightenment, clarity, hope, divine guidance',
            'running': 'Avoidance, escaping from something, urgency or anxiety',
            'death': 'Transformation, endings leading to new beginnings, change',
            'birth': 'New beginnings, creative potential, fresh start',
            'fire': 'Passion, transformation, anger, or purification',
            'cloud': 'Confusion, obscured vision, transition or lightness',
            'star': 'Hope, guidance, aspirations, divine connection',
            'owl': 'Wisdom, intuition, seeing what is hidden in darkness',
            'snake': 'Transformation, healing, hidden fears or wisdom',
            'bridge': 'Transition, connection between two states or places',
            'garden': 'Growth, cultivation of ideas, paradise or peace',
            'storm': 'Emotional turmoil, conflict, powerful change',
            'sun': 'Consciousness, vitality, life force, clarity',
            'moon': 'Intuition, feminine energy, cycles, hidden aspects',
            'tree': 'Life, growth, connection between earth and sky',
            'bird': 'Freedom, perspective, spiritual messages',
            'child': 'Innocence, new beginnings, inner child',
            'road': 'Life path, journey, direction in life'
        };

        function interpretDream() {
            if (scenes.length === 0) {
                alert('Add dream scenes first to interpret');
                return;
            }

            let interpretation = [`🔮 Dream Interpretation\n${'='.repeat(40)}\n\n`];
            interpretation.push('⚠️ DISCLAIMER: This interpretation is based on common dream symbolism\n');
            interpretation.push('and psychological theory. It is not a substitute for professional\n');
            interpretation.push('psychological or medical advice. Dream meanings are highly personal.\n\n');
            interpretation.push('─'.repeat(40) + '\n\n');
            
            // Analyze all scenes for symbolic content
            const foundSymbols = new Map();
            
            scenes.forEach(scene => {
                const sceneLower = scene.name.toLowerCase();
                Object.keys(dreamSymbols).forEach(symbol => {
                    if (sceneLower.includes(symbol)) {
                        if (!foundSymbols.has(symbol)) {
                            foundSymbols.set(symbol, []);
                        }
                        foundSymbols.get(symbol).push(scene.name);
                    }
                });
            });

            if (foundSymbols.size === 0) {
                interpretation.push('No common dream symbols detected in your scenes.\n\n');
                interpretation.push('💭 General Interpretation:\n');
                interpretation.push('Your dream appears to be highly personal and unique. Consider:\n');
                interpretation.push('• What emotions did you feel during each scene?\n');
                interpretation.push('• Are there recurring themes or patterns?\n');
                interpretation.push('• How do the scenes connect to your waking life?\n\n');
            } else {
                interpretation.push('🌟 Symbolic Meanings Found:\n\n');
                
                foundSymbols.forEach((sceneList, symbol) => {
                    interpretation.push(`📌 ${symbol.toUpperCase()}`);
                    interpretation.push(`   Meaning: ${dreamSymbols[symbol]}`);
                    interpretation.push(`   Found in: "${sceneList[0]}"${sceneList.length > 1 ? ` (and ${sceneList.length - 1} more)` : ''}`);
                    interpretation.push('');
                });

                interpretation.push('\n');
            }

            // Analyze transition patterns
            interpretation.push('🔄 Pattern Analysis:\n');
            
            const totalScenes = scenes.length;
            const scenesWithTransitions = scenes.filter(s => s.edges.length > 0).length;
            const avgTransitions = scenes.reduce((sum, s) => sum + s.edges.length, 0) / totalScenes;
            
            interpretation.push(`• Dream Complexity: ${totalScenes} scenes with ${avgTransitions.toFixed(1)} avg transitions`);
            
            if (scenesWithTransitions < totalScenes) {
                interpretation.push(`• ${totalScenes - scenesWithTransitions} scene(s) have no exits - possible resolution points`);
            }

            if (scenes.length > 0 && scenes.some(s => s.edges.length > 0)) {
                const mostConnected = scenes.reduce((max, s) => 
                    s.edges.length > max.edges.length ? s : max
                );
                if (mostConnected.edges.length > 0) {
                    interpretation.push(`• Central theme: "${mostConnected.name}" (most connected scene)`);
                }
            }

            interpretation.push('\n💡 Reflection Questions:');
            interpretation.push('• What real-life situations mirror these dream transitions?');
            interpretation.push('• Which scenes evoke the strongest emotions?');
            interpretation.push('• What patterns repeat in your waking life?');
            interpretation.push('• How do the probabilities reflect your feelings about choices?');

            const output = document.getElementById('sequenceOutput');
            output.style.display = 'block';
            output.textContent = interpretation.join('\n');
        }
    </script>
